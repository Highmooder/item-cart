<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#1F6F4A" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/icon-32.png" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="Item cart" />
  <title>Vendor Store — Item cart</title>
  <meta name="description" content="Browse this vendor&#x27;s products on Item cart, the student marketplace around your campus." />
  <meta property="og:site_name" content="Item cart" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Vendor Store — Item cart" />
  <meta property="og:description" content="Browse this vendor&#x27;s products on Item cart, the student marketplace around your campus." />
  <meta property="og:image" content="https://YOUR-SITE-ADDRESS/assets/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/transitions.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/pages/vendor-store.css" />
</head>
<body>

  <header class="site-header" id="site-header"></header>
  <script src="js/header-prepaint.js"></script>

  <main id="main-content">
    <div class="container">

      <div class="loading-state" data-page-loading role="status">Loading store…</div>

      <div class="empty-state" id="vendor-missing" style="display:none;">
        <h1>We couldn't find that vendor.</h1>
        <p>The link may be incorrect, or this store may no longer exist.</p>
        <a href="marketplace.html" class="btn btn-primary btn-sm">Back to Marketplace</a>
      </div>

      <div id="vendor-found" style="display:none;">
        <section class="vendor-hero" id="vendor-hero"></section>

        <p class="vendor-inactive-notice" id="vendor-inactive-notice" style="display:none;">
          This vendor isn't currently active on Item cart, so their store isn't taking orders right now.
        </p>

        <section class="vendor-products">
          <div class="section-head">
            <div>
              <h2>Products</h2>
            </div>
          </div>
          <div class="product-grid" id="vendor-product-grid"></div>
        </section>
      </div>

    </div>
  </main>

  <footer class="site-footer" id="site-footer"></footer>

  <script type="module" src="js/pages/vendor-store.js"></script>
</body>
</html>
